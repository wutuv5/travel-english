name: iOS validation IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Record build environment
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          xcodebuild -version | tee build/artifacts/build-environment.txt
          sw_vers | tee -a build/artifacts/build-environment.txt
          git rev-parse HEAD | tee -a build/artifacts/build-environment.txt
      - name: Install pinned project generator
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-tool"
          "$RUNNER_TEMP/xcodegen-tool/xcodegen/bin/xcodegen" --version | tee -a build/artifacts/build-environment.txt
          "$RUNNER_TEMP/xcodegen-tool/xcodegen/bin/xcodegen" generate --spec ios/project.json --project ios
      - name: Test IPA packaging
        run: python3 -m unittest discover -s tests -v
      - name: Compile simulator target
        run: |
          set -euo pipefail
          xcodebuild -project ios/TravelEnglish.xcodeproj -scheme TravelEnglish -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > build/artifacts/simulator-build.log 2>&1
      - name: Compile unsigned device target
        run: |
          set -euo pipefail
          xcodebuild -project ios/TravelEnglish.xcodeproj -scheme TravelEnglish -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 build > build/artifacts/device-build.log 2>&1
          python3 scripts/package_ipa.py build/device/Build/Products/Release-iphoneos/TravelEnglish.app build/artifacts/TravelEnglish-unsigned.ipa
      - name: Boot simulator
        timeout-minutes: 4
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > build/artifacts/simulator-devices.json
          DEVICE_ID=$(python3 -c 'import json; devices=json.load(open("build/artifacts/simulator-devices.json"))["devices"]; runtimes=sorted((r for r in devices if "iOS-26" in r),key=lambda r:("iOS-26-2" in r,r),reverse=True); print(next(d["udid"] for r in runtimes for d in devices[r] if "iPhone" in d["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Run interaction regression tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcodebuild -project ios/TravelEnglish.xcodeproj -scheme TravelEnglish -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -destination-timeout 60 -parallel-testing-enabled NO -resultBundlePath build/InteractionTests.xcresult CODE_SIGNING_ALLOWED=NO test > build/artifacts/interaction-tests.log 2>&1
      - name: Export UI test screenshots
        if: always()
        timeout-minutes: 2
        run: |
          if [ -d build/InteractionTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/InteractionTests.xcresult --output-path build/artifacts/screenshots || true
          fi
      - name: Upload IPA and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TravelEnglish-validation-${{ github.run_number }}
          path: build/artifacts/
          retention-days: 14
          if-no-files-found: warn
